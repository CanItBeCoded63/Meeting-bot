  provider: azure
  model: gpt-5.2-chat

joinly:
  language: en
  self_aliases:
    - Gantec Teams Assistant
  vad: silero
  stt: deepgram
  tts: deepgram
  args:
    vad: {}
    stt:
      model_name: nova-3-general
    tts:
      model_name: aura-2-odysseus-en

